<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather Aether State Gallery</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#11151d;color:#edf2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}
h1{font-size:22px;font-weight:600;margin:0}
label{display:flex;align-items:center;gap:8px;color:#b8c2d1;font-size:14px}
.controls{display:flex;gap:14px;flex-wrap:wrap}
select{font:inherit;color:#edf2f7;background:#202735;border:1px solid #3a4558;border-radius:8px;padding:7px 28px 7px 10px}
main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
figure{position:relative;aspect-ratio:16/9;margin:0;overflow:hidden;border:1px solid #364156;border-radius:12px;background:#080b11}
iframe{display:block;width:100%;height:100%;border:0;pointer-events:none}
figcaption{position:absolute;left:12px;bottom:10px;padding:5px 9px;border-radius:7px;background:rgba(8,12,20,.64);backdrop-filter:blur(8px);font-size:13px;font-weight:600;text-transform:capitalize;letter-spacing:.2px}
.renderer-status{position:absolute;right:10px;top:10px;padding:4px 7px;border-radius:6px;background:rgba(8,12,20,.76);color:#e5ad62;font:700 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2px;text-transform:none}
.renderer-status[data-renderer="three"]{color:#75e6a4}.renderer-status[data-error="true"]{color:#ff7b72}
@media(max-width:800px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header>
  <h1>Weather Aether state gallery</h1>
  <div class="controls">
    <label for="renderer">Renderer
      <select id="renderer">
        <option value="three" selected>Three.js volumetric</option>
        <option value="canvas">Canvas baseline</option>
      </select>
    </label>
    <label for="time">Light
      <select id="time">
        <option value="6.5">Dawn</option>
        <option value="12" selected>Noon</option>
        <option value="17.5">Dusk</option>
        <option value="22">Night</option>
      </select>
    </label>
  </div>
</header>
<main id="gallery"></main>
<script>
'use strict';
var states=['clear','partly','overcast','fog','rain','sleet','snow','thunder'];
var gallery=document.getElementById('gallery');
var time=document.getElementById('time');
var renderer=document.getElementById('renderer');
function draw(){
  gallery.innerHTML='';
  for(var i=0;i<states.length;i++){
    var state=states[i];
    var figure=document.createElement('figure');
    var frame=document.createElement('iframe');
    frame.src='../Resources/Wallpapers/WeatherAether/index.html?preview='+state+'&hour='+time.value+'&minimal=1&renderer='+renderer.value;
    frame.setAttribute('aria-label',state+' weather preview');
    var label=document.createElement('figcaption');
    label.textContent=state;
    var status=document.createElement('span');
    status.className='renderer-status';status.textContent='checking renderer…';
    figure.appendChild(frame);figure.appendChild(label);figure.appendChild(status);gallery.appendChild(figure);
  }
}
window.addEventListener('message',function(event){
  var data=event.data;
  if(!data||data.type!=='weather-aether-renderer-status')return;
  var frames=gallery.querySelectorAll('iframe');
  for(var i=0;i<frames.length;i++){
    if(frames[i].contentWindow!==event.source)continue;
    var status=frames[i].parentElement.querySelector('.renderer-status');
    status.dataset.renderer=data.renderer;
    status.dataset.error=data.error?'true':'false';
    status.textContent=data.error?'SHADER ERROR':
      data.renderer.toUpperCase()+' · '+data.revision+(data.renderer==='three'?' · volume '+(data.volume?'on':'off'):'');
    if(data.error)status.title=data.error;
    break;
  }
});
time.addEventListener('change',draw);
renderer.addEventListener('change',draw);
draw();
</script>
</body>
</html>
