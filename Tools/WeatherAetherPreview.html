<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather Aether State Gallery</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#11151d;color:#edf2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}
h1{font-size:22px;font-weight:600;margin:0}
label{display:flex;align-items:center;gap:8px;color:#b8c2d1;font-size:14px}
.controls{display:flex;gap:14px;flex-wrap:wrap}
select{font:inherit;color:#edf2f7;background:#202735;border:1px solid #3a4558;border-radius:8px;padding:7px 28px 7px 10px}
main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
figure{position:relative;aspect-ratio:16/9;margin:0;overflow:hidden;border:1px solid #364156;border-radius:12px;background:#080b11}
iframe{display:block;width:100%;height:100%;border:0;pointer-events:none}
figcaption{position:absolute;left:12px;bottom:10px;padding:5px 9px;border-radius:7px;background:rgba(8,12,20,.64);backdrop-filter:blur(8px);font-size:13px;font-weight:600;text-transform:capitalize;letter-spacing:.2px}
.renderer-status{position:absolute;right:10px;top:10px;max-width:72%;padding:4px 7px;border-radius:6px;background:rgba(8,12,20,.76);color:#e5ad62;font:700 10px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2px;text-align:right;text-transform:none;white-space:normal}
.renderer-status[data-renderer="three"]{color:#75e6a4}.renderer-status[data-error="true"]{color:#ff7b72}
@media(max-width:800px){main{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header>
  <h1>Weather Aether state gallery</h1>
  <div class="controls">
    <label for="view">Preview set
      <select id="view">
        <option value="rain" selected>Rain intensity</option>
        <option value="weather">All weather states</option>
      </select>
    </label>
    <label for="renderer">Renderer
      <select id="renderer">
        <option value="three" selected>Three.js volumetric</option>
        <option value="canvas">Canvas baseline</option>
      </select>
    </label>
    <label for="time">Light
      <select id="time">
        <option value="6.5">Dawn</option>
        <option value="12" selected>Noon</option>
        <option value="17.5">Dusk</option>
        <option value="22">Night</option>
      </select>
    </label>
    <label for="quality">Quality
      <select id="quality">
        <option value="eco">Eco</option>
        <option value="balanced" selected>Balanced</option>
        <option value="showcase">Showcase</option>
      </select>
    </label>
  </div>
</header>
<main id="gallery"></main>
<script>
'use strict';
var stateGroups={
weather:[
  {key:'clear',label:'Clear'},
  {key:'partly',label:'Partly cloudy'},
  {key:'overcast',label:'Overcast'},
  {key:'fog',label:'Fog'},
  {key:'moderate-rain',label:'Moderate rain'},
  {key:'freezing',label:'Freezing precipitation'},
  {key:'snow',label:'Snow'},
  {key:'thunder',label:'Thunderstorm'},
  {key:'hail',label:'Hail'}
],
rain:[
  {key:'light-drizzle',label:'Light drizzle · 16%'},
  {key:'moderate-drizzle',label:'Moderate drizzle · 28%'},
  {key:'dense-drizzle',label:'Dense drizzle · 42%'},
  {key:'slight-rain',label:'Slight rain · 38%'},
  {key:'moderate-rain',label:'Moderate rain · 66%'},
  {key:'heavy-rain',label:'Heavy rain · 100%'},
  {key:'slight-showers',label:'Slight showers · intermittent'},
  {key:'moderate-showers',label:'Moderate showers · intermittent'},
  {key:'violent-showers',label:'Violent showers · intermittent'}
]};
var gallery=document.getElementById('gallery');
var view=document.getElementById('view');
var time=document.getElementById('time');
var renderer=document.getElementById('renderer');
var quality=document.getElementById('quality');
function draw(){
  gallery.innerHTML='';
  var states=stateGroups[view.value];
  for(var i=0;i<states.length;i++){
    var state=states[i];
    var figure=document.createElement('figure');
    var frame=document.createElement('iframe');
    frame.src='../Resources/Wallpapers/WeatherAether/index.html?preview='+state.key+'&hour='+time.value+'&minimal=1&renderer='+renderer.value+'&quality='+quality.value;
    frame.setAttribute('aria-label',state.label+' weather preview');
    var label=document.createElement('figcaption');
    label.textContent=state.label;
    var status=document.createElement('span');
    status.className='renderer-status';status.textContent='checking renderer…';
    figure.appendChild(frame);figure.appendChild(label);figure.appendChild(status);gallery.appendChild(figure);
  }
}
window.addEventListener('message',function(event){
  var data=event.data;
  if(!data||data.type!=='weather-aether-renderer-status')return;
  var frames=gallery.querySelectorAll('iframe');
  for(var i=0;i<frames.length;i++){
    if(frames[i].contentWindow!==event.source)continue;
    var status=frames[i].parentElement.querySelector('.renderer-status');
    status.dataset.renderer=data.renderer;
    status.dataset.error=data.error?'true':'false';
    if(data.error){
      status.textContent='SHADER ERROR';
    }else if(data.renderer==='three'&&data.metrics){
      status.textContent='THREE · '+data.quality+' · '+data.metrics.fps.toFixed(1)+'/'+data.targetFps+' fps · '+data.steps+' steps · '+
        data.metrics.p95.toFixed(1)+' ms p95 · '+data.metrics.submitAverage.toFixed(2)+' ms submit · '+
        data.metrics.width+'×'+data.metrics.height+' · '+data.metrics.drawCalls+' draw · volume '+(data.volume?'on':'off')+
        (data.rain?' · intensity '+Math.round(data.precipitationIntensity*100)+'% · activity '+Math.round(data.precipitationActivity*100)+'%':'')+
        ((data.rain||data.snow||data.hail)&&data.motionMetrics?' · motion '+data.motionMetrics.fps.toFixed(1)+'/'+data.motionTargetFps+' fps · '+data.motionMetrics.p95.toFixed(1)+' ms p95 · '+data.motionMetrics.drawCalls+' draw · '+(data.rain?'rain 3D':data.snow?'snow 3D':'hail 3D'):'');
    }else{
      status.textContent=data.renderer.toUpperCase()+' · '+data.revision+
        (data.renderer==='three'?' · '+data.quality+' · volume '+(data.volume?'on':'off'):'');
    }
    if(data.error)status.title=data.error;
    break;
  }
});
time.addEventListener('change',draw);
renderer.addEventListener('change',draw);
quality.addEventListener('change',draw);
view.addEventListener('change',draw);
draw();
</script>
</body>
</html>
