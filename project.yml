name: ÆtherDesk
options:
  bundleIdPrefix: com.aetherdesk
  deploymentTarget:
    macOS: "12.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: ÆtherDesk
    PRODUCT_BUNDLE_IDENTIFIER: com.aetherdesk.AetherDesk
    MARKETING_VERSION: "1.0.15"
    CURRENT_PROJECT_VERSION: "19"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    DEAD_CODE_STRIPPING: YES

targets:
  AetherDesk:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Core
      - path: WallpaperTypes
      - path: LivelyCompatibility
      - path: Import
      - path: UI
      - path: Persistence
      # Non-code resources, minus Info.plist / entitlements (handled via
      # build settings below) and minus the Wallpapers folder (added as a
      # folder reference so per-wallpaper subdirectories are preserved).
      - path: Resources
        excludes:
          - "Info.plist"
          - "AetherDesk.entitlements"
          - "Wallpapers"
          - "Wallpapers/**"
        buildPhase: resources
      # Keep bundled wallpapers as a folder reference so each wallpaper's
      # index.html + LivelyInfo.json + LivelyProperties.json stays grouped
      # under Resources/Wallpapers/<Name>/ in the built app.
      - path: Resources/Wallpapers
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/AetherDesk.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Resources/AetherDesk.entitlements
    dependencies: []

  AetherDeskTests:
    type: bundle.unit-test
    platform: macOS
    # Compile app sources directly into the test target so there is no Swift
    # module name conflict with the app target. main.swift is excluded because
    # it starts NSApplication; all other source files are safe to compile in
    # a unit-test context.
    sources:
      - path: Tests
      - path: App
        excludes:
          - "main.swift"
      - path: Core
      - path: WallpaperTypes
      - path: LivelyCompatibility
      - path: Import
      - path: UI
      - path: Persistence
    dependencies: []
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: AetherDeskTests

schemes:
  AetherDesk:
    build:
      targets:
        AetherDesk: all
        AetherDeskTests: [testing]
    test:
      targets:
        - AetherDeskTests
