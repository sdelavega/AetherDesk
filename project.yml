name: ÆtherDesk
options:
  bundleIdPrefix: com.sdelavega
  deploymentTarget:
    macOS: "12.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  createIntermediateGroups: true

# AppStore is a release-type configuration that enables sandbox + WeatherKit.
# OSS builds use Debug or Release — no changes to those configs.
configs:
  Debug: debug
  Release: release
  AppStore: release

settings:
  base:
    PRODUCT_NAME: ÆtherDesk
    PRODUCT_BUNDLE_IDENTIFIER: com.sdelavega.AetherDesk
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "26"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    AppStore:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: AETHERDESK_STORE

targets:
  AetherDesk:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Core
      - path: WallpaperTypes
      - path: LivelyCompatibility
      - path: Import
      - path: UI
      - path: Persistence
      # Non-code resources, minus Info.plist / entitlements (handled via
      # build settings below) and minus the Wallpapers folder (added as a
      # folder reference so per-wallpaper subdirectories are preserved).
      - path: Resources
        excludes:
          - "Info.plist"
          - "AetherDesk.entitlements"
          - "Wallpapers"
          - "Wallpapers/**"
        buildPhase: resources
      # Keep bundled wallpapers as a folder reference so each wallpaper's
      # index.html + LivelyInfo.json + LivelyProperties.json stays grouped
      # under Resources/Wallpapers/<Name>/ in the built app.
      - path: Resources/Wallpapers
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/AetherDesk.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "12.0"
      configs:
        # AppStore: macOS 13 minimum, sandbox enabled, WeatherKit linked.
        AppStore:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          CODE_SIGN_ENTITLEMENTS: AetherDeskAppStore.entitlements
          OTHER_LDFLAGS: "$(inherited) -weak_framework WeatherKit"
    dependencies: []

  AetherDeskTests:
    type: bundle.unit-test
    platform: macOS
    # Compile app sources directly into the test target so there is no Swift
    # module name conflict with the app target. main.swift is excluded because
    # it starts NSApplication; all other source files are safe to compile in
    # a unit-test context.
    sources:
      - path: Tests
      - path: App
        excludes:
          - "main.swift"
      - path: Core
      - path: WallpaperTypes
      - path: LivelyCompatibility
      - path: Import
      - path: UI
      - path: Persistence
    dependencies: []
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: AetherDeskTests

schemes:
  AetherDesk:
    build:
      targets:
        AetherDesk: all
        AetherDeskTests: [testing]
    test:
      targets:
        - AetherDeskTests

  # Use this scheme to build / archive the Mac App Store version.
  # It activates the AppStore configuration, which enables sandbox,
  # WeatherKit, and the AETHERDESK_STORE compilation flag.
  AetherDesk-AppStore:
    build:
      targets:
        AetherDesk: all
    run:
      config: AppStore
    test:
      config: AppStore
      targets:
        - AetherDeskTests
    profile:
      config: AppStore
    analyze:
      config: AppStore
    archive:
      config: AppStore
